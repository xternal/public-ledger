status: promised
status_note: >-
  The test comes at the Budget on 28 October 2026, when the OBR judges whether the government's plans meet the
  rules in the Charter for Budget Responsibility. The Prime Minister repeated the commitment at Prime Minister's
  Questions on 2 September 2026, describing the debt rule as debt falling "by the end of the Parliament"; the
  Charter sets 2029-30.
