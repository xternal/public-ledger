versions:
  - version: 1
    text: >-
      The Conservatives have a cheap power plan to slash energy costs for the entire economy. It involves
      hard-nosed choices: repealing the Climate Change Act 2008, axing the emissions trading scheme, scrapping wind
      and solar subsidies, investing in nuclear and getting the North sea drilling again.
    recorded_on: "2026-09-09"
    source_url: https://hansard.parliament.uk/Commons/2026-09-09/debates/CAB0EF73-A8DD-4708-AF57-2221AD011A5A/JaguarLandRoverRedundancies
    quote_checked_on: "2026-10-07"
    parameters:
      who: >-
        Electricity bill payers, households and businesses (the party says the Cheap Power Plan would save the
        average family £200 a year on electricity bills); wind and solar generators that receive subsidies
      cost_note: >-
        No costing of the effect on the public finances published. The party's figures are savings on bills, not
        public-finance figures: it says axing the carbon tax would cut bills by almost £8bn a year (6 October 2025
        speech) and that the plan would save households £200 a year, and a report by Onward that the party
        published on 19 August 2026 puts savings on electricity bills at over £320bn by 2050. The party's savings
        list includes £1.6bn from scrapping "green subsidies", with no year and no list of which subsidies.
      cost_sources:
