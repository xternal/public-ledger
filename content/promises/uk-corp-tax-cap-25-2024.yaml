status_note: >-
  The Corporate Tax Roadmap (October 2024) commits to the 25% cap for the Parliament, and Finance Acts have set the
  main rate at 25% for the financial years starting April 2026 and April 2027. Later years are not yet set in law, so
  the card sits at Legislated until the end of the Parliament, taken as 1 July 2029.
