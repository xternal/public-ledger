    quote_checked_on: "2026-10-07"
    parameters:
      who: >-
        Landlords in England with properties under let, who must register; their tenants; and councils, which get
        access to the information (the government says this will help them "spot rogue landlords and take quicker
        action")
      cost_note: >-
        No costing published. Under the draft regulations, a fee must be paid to make or renew (every 12 months) each
        dwelling entry, and in some cases to reactivate one; the database operator sets the fee by reference to its relevant costs (draft
        regulations 6(5), 10(2), 12(5) and 14).
      cost_sources:
        - title: "Draft Private Rented Sector Database Regulations 2026, legislation.gov.uk"
          url: https://www.legislation.gov.uk/ukdsi/2026/9780348286861/contents
      when: >-
        Launch on 15 December 2026 in the West Midlands, then other regions over 12 months; landlords in each region
        get three months to sign up once it is called forward, and all landlords actively letting must be registered
        by 14 November 2027
      funded_by: null
