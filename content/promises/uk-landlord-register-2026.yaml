policy_area: housing_env
status: in_plan
status_note: >-
  The register is due to launch on 15 December 2026 in the West Midlands and reach other regions over 12 months;
  the Private Rented Sector Database Regulations 2026 were laid in draft on 9 September 2026 and need approval by
  both Houses, and section 75 of the Renters’ Rights Act 2025, which creates the database, is not yet in force.
  The same release says HMRC’s Valuation Office will take over decisions on challenges to rent increases in
  England; until then renters apply to the First-tier Tribunal.
