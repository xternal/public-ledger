headline: "Widen Awaab's Law to more home hazards"
actor_id: hm-government
made_on: "2026-10-08"
venue: press_release
venue_label: Press release (MHCLG), notes to editors
policy_area: housing_env
status: in_plan
status_note: >-
  Awaab's Law sets legal deadlines for social landlords in England to investigate and fix dangerous hazards; since
  October 2025 it has covered damp and mould. Draft regulations published on 13 July 2026 would add excess cold,
  excess heat, domestic hygiene, falls, electrical, explosion and structural collapse hazards from 30 November 2026;
  they need Parliament's approval.
