id: uk-reform-personal-allowance-15k-2026
headline: "Raise the personal allowance to £15,000"
actor_id: reform-uk
made_on: "2026-09-05"
venue_label: "The First 100 Days: Our Pledges to You, page 12"
policy_area: taxes
status: promised
status_note: >-
  Reform UK is not in government, so the card stays at Promised. This pledge replaces the party's 2024 aim of a
  £20,000 allowance, which it said in November 2025 it was no longer committed to; the same document keeps
  £20,000 as a long-term ambition.
