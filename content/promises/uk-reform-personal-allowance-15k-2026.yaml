versions:
  - version: 1
    text: >-
      The first Budget of a Reform government will increase the tax-free personal allowance for income tax to
      £15,000, beginning at the next tax year.
    recorded_on: "2026-09-05"
    source_url: https://www.reformparty.uk/policies/the-first-100-days-our-pledges-to-you/pdf
    quote_checked_on: "2026-10-06"
    parameters:
      who: >-
        Income taxpayers earning under £100,000 (the party says about 40 million, with 2.9 million taken out of
        income tax). The higher-rate threshold stays at £50,270 and the taper above £100,000 is kept.
      how_much_bn_per_year: [19.0, 21.1, 23.2]
      cost_note: >-
        Year shown: the fifth year, the latest year Reform UK costed. The party's own costing, including a
        behavioural adjustment, is £17.7bn in the first year (2026-27 incomes), rising to £21.1bn by the fifth year
        (central). No independent costing of the £15,000 pledge was found on 6 Oct 2026; an editor should add one
        when published.
        Low–high is an editorial ±10% because the source gives a central figure only.
      cost_sources:
        - title: "Reform UK: The First 100 Days, Costings (pages 13-14)"
          url: https://www.reformparty.uk/policies/the-first-100-days-our-pledges-to-you/pdf
        - title: "BBC News, 5 Sep 2026"
          url: https://www.bbc.co.uk/news/articles/cgk5g51xk57o
      when: In the first Budget of a Reform government, pledged within its first 100 days; takes effect at the start of the next tax year
      funded_by: >-
        Previously announced savings: £52bn a year from the Making Welfare Work programme by the end of the next
        Parliament, £7bn from eliminating most foreign aid, £10bn from cutting net zero programmes and £7bn from
        shrinking the government by the end of the next Parliament, plus immigration-related savings (the party lists
        £91bn of itemised savings and new revenue against £58bn of costs).
