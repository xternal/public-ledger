status_note: >-
  A pledge about Scottish income tax, which the Scottish Parliament sets. The SNP leads the Scottish Government
  (First Minister John Swinney), so each year's Scottish rate resolution tests it, starting with 2027-28. The
  manifesto introduces it "accepting that all governments require flexibility to respond to material changes in
  circumstances". It covers the number of bands and their rates, not the thresholds.
