versions:
  - version: 1
    text: I can announce today, fully costed and fully funded, the removal of the two-child limit in full from April.
    recorded_on: "2025-11-26"
    source_url: https://hansard-api.parliament.uk/debates/debate/0FD15A2E-84B6-49F0-939A-24B7AABFB798.json
    quote_checked_on: "2026-10-06"
    parameters:
      who: Families on Universal Credit with three or more children
      how_much_bn_per_year: [2.1285, 2.365, 2.6015]
      cost_note: >-
        Year shown: 2026-27, the first full year (Budget 2025 policy table, certified by the OBR); central
        figure only. Other years in the same table: £2.590bn in 2027-28, £2.815bn in 2028-29, £3.095bn in
        2029-30 and £3.235bn in 2030-31. The OBR puts the cost at £3bn by 2029-30, with 560,000 families
        gaining £5,310 a year on average.
        Low–high is an editorial ±10% because the source gives a central figure only.
      cost_sources:
