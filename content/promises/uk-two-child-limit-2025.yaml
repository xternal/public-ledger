venue_label: Budget statement, House of Commons
policy_area: social_protection
status: delivered
status_note: >-
  The Universal Credit (Removal of Two Child Limit) Act 2026 became law on 18 March 2026 and the limit stopped
  applying from assessment periods starting on or after 6 April 2026, as DWP's official statistics confirm.
