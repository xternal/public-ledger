status: in_plan
status_note: >-
  The scheme is in the government's plans (Modern Industrial Strategy, June 2025; consultation responses of
  16 April and July 2026), and applications opened on 1 October 2026 and close on 30 November 2026. Exemptions
  on bills start in April 2027. Draft regulations amending the Renewables Obligation and Capacity Market rules
  were laid on 7 September 2026 and need approval by both Houses; none had been made by 7 October 2026. The
  Exchequer funding is due to be scored at Budget 2026, so the card stays at In plan.
