id: uk-ld-free-personal-care-2024
headline: "Introduce free personal care, based on need"
actor_id: liberal-democrats
made_on: "2024-06-10"
venue: manifesto
venue_label: 2024 manifesto, page 37
policy_area: social_protection
status: promised
status_note: >-
  The Liberal Democrats are not in government. In July 2026 the party restated free personal care as one of its
  three tests on social care for the new Prime Minister. On 29 September 2026 Prime Minister Andy Burnham promised
  free personal care for people over 65 through a National Care Service in the next parliament; it does not cover
  working-age adults, and no detailed plan, legislation or funding has been published, so the card stays at
  Promised.
