id: uk-defence-25-2027
actor_id: keir-starmer
made_on: "2025-02-25"
venue: parliament
venue_label: Commons statement on defence and security
policy_area: defence
status: funded
status_note: >-
  The Spending Review 2025 set the defence budget on a path to 2.6% of GDP on NATO's measure by 2027 (2.5% on
  the older measure plus intelligence spending), and the June 2026 Defence Investment Plan plans 2.6% in 2026-27
  and 2.7% from 2027-28. Whether the level is reached can only be checked against 2027-28 spending, so the card
  stays at Funded.
