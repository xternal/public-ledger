versions:
  - version: 1
    text: >-
      We will deliver our commitment to spend 2.5% of GDP on defence, but we will bring it forward so that we
      reach that level in 2027 and we will maintain that for the rest of this Parliament.
    recorded_on: "2025-02-25"
    source_url: https://hansard.parliament.uk/commons/2025-02-25/debates/8BF58F19-B32B-4716-A613-8D5738541A30/DefenceAndSecurity
    quote_checked_on: "2026-10-06"
    parameters:
      who: The armed forces and defence budget; paid for by a cut to overseas aid
      how_much_bn_per_year: [6.0, 13.4, 13.4]
      cost_note: >-
        Year shown: 2027-28, the first full year at the new level. The PM put it at £13.4bn more on defence
        every year from 2027 (central). The IFS said an extra 0.2% of GDP is around £6bn (low), and that the
        £13.4bn figure seems to assume the defence budget would otherwise have been frozen in cash terms. The
        government counts more intelligence spending as defence from 2027, taking the total to 2.6% of GDP on
        NATO's measure, which is the level the sandbox preset uses.
      cost_sources:
