versions:
  - version: 1
    text: >-
      We will abolish non-dom status once and for all, replacing it with a modern scheme for people genuinely in the
      country for a short period.
    recorded_on: "2024-06-13"
    source_url: https://labour.org.uk/wp-content/uploads/2024/06/Labour-Party-manifesto-2024.pdf#page=21
    quote_checked_on: "2026-10-06"
    parameters:
      who: >-
        UK residents who used non-dom status now pay UK tax on worldwide income and gains; people who become UK
        resident after at least 10 years as non-residents can claim relief on foreign income and gains for up to 4 years
      how_much_bn_per_year: [-2.7995, -2.545, -2.2905]
      cost_note: >-
        Negative because the pledge raises money. Year used: 2028-29, the year Labour's costings use. The official
        Autumn Budget 2024 costing of Labour's changes, on top of the abolition already in the forecast since March
        2024, is £2,545m in 2028-29 (Table 5.1, line 20); central figure only. Other years: negligible in 2025-26,
        £4,170m in 2026-27, £5,895m in 2027-28 and £95m in 2029-30, as the temporary repatriation facility ends.
        Labour's own costings do not show the measure separately: it is part of £5,230m in 2028-29 from non-dom
        loopholes and tax avoidance, plus £600m in 2025-26 from removing the non-dom discount (manifesto page 127).
        Low–high is an editorial ±10% because the source gives a central figure only.
      cost_sources:
        - title: "HM Treasury: Autumn Budget 2024, Table 5.1, line 20"
          url: https://assets.publishing.service.gov.uk/media/672b9695fbd69e1861921c63/Autumn_Budget_2024_Accessible.pdf
        - title: "Labour Party: Change, 2024 manifesto (PDF), costings, page 127"
          url: https://labour.org.uk/wp-content/uploads/2024/06/Labour-Party-manifesto-2024.pdf#page=127
      when: From 6 April 2025
      funded_by: >-
        Not a spending pledge; the manifesto says NHS appointments will be "paid for by cracking down on tax avoidance
        and non-dom loopholes" (page 10)
