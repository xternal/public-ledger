id: uk-abolish-non-dom-2024
headline: "Abolish non-dom status"
actor_id: labour
made_on: "2024-06-13"
venue: manifesto
venue_label: 2024 manifesto, page 21
policy_area: taxes
status: delivered
status_note: >-
  Finance Act 2025 ended the remittance basis for non-domiciled individuals after the 2024-25 tax year, and on 6 April
  2025 a 4-year foreign income and gains regime for new arrivals replaced it. The previous government had announced an
  end to the regime in March 2024; Labour's Autumn Budget 2024 changed parts of the design, such as removing a planned
  50% discount on foreign income in 2025-26.
