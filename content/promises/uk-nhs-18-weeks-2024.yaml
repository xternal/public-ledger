id: uk-nhs-18-weeks-2024
actor_id: keir-starmer
made_on: "2024-12-05"
venue_label: Plan for Change, PM's foreword, page 6
policy_area: health
status: delivering
status_note: >-
  NHS England's plan sets March 2029 for the 92% standard, and the Spending Review 2025 ties the NHS
  settlement to it. The share of patients waiting under 18 weeks met the interim 65% goal in March 2026
  (65.3%) and stood at 65.4% in July 2026, still well short of 92%, so the card sits at Delivering.
