id: uk-carried-interest-2024
headline: "Close the carried interest loophole"
actor_id: labour
made_on: "2024-06-13"
venue: manifesto
venue_label: 2024 manifesto, page 21
policy_area: taxes
status: delivered
status_note: >-
  From the 2026-27 tax year, carried interest (the share of a fund's profits paid to its managers) is taxed under
  income tax instead of capital gains tax (Finance Act 2026, section 58). Under the design announced at Autumn Budget
  2024, a 72.5% multiplier applies to qualifying carried interest brought into the charge (para 5.67). As an interim
  step, the capital gains tax rates on carried interest rose to 32% from 6 April 2025.
