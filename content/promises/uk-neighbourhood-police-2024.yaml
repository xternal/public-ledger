id: uk-neighbourhood-police-2024
actor_id: labour
made_on: "2024-06-13"
venue: manifesto
venue_label: 2024 manifesto, page 64
policy_area: public_order
status: delivering
status_note: >-
  The Neighbourhood Policing Guarantee started in April 2025 with a £200m grant. Official statistics show 3,814 more
  full-time-equivalent officers and PCSOs in neighbourhood roles at 31 March 2026 than a year earlier. Over the same
  year the total number of police officers fell by 566 FTE, PCSOs by 55 FTE and special constables by 324
  (headcount); the neighbourhood measure counts officers and PCSOs, including those in training, but not special
  constables (Home Office, Police workforce, 31 March 2026). The manifesto text says "thousands"; its costings (page 129) and the government's milestone put the number at 13,000. The
  manifesto gives no date; the government's milestone is this Parliament, taken as by 1 July 2029.
deadline: "2029-07-01"
origin: manual
