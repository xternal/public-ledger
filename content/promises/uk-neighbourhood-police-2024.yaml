versions:
  - version: 1
    text: >-
      Labour will introduce a new Neighbourhood Policing Guarantee, restoring patrols to our town centres by recruiting
      thousands of new police officers, police and community support officers, and special constables.
    recorded_on: "2024-06-13"
    source_url: https://labour.org.uk/wp-content/uploads/2024/06/Labour-Party-manifesto-2024.pdf#page=64
    quote_checked_on: "2026-10-06"
    parameters:
      who: Communities in England and Wales; police forces recruit or move officers, PCSOs and special constables into neighbourhood roles
      how_much_bn_per_year: [0.36, 0.4, 0.44]
      cost_note: >-
        Year used: the year of highest cost, as Labour's costings give one annualised figure. Labour re-allocates £400m
        a year from a Police Efficiency and Collaboration Programme to "13,000 additional neighbourhood police and
        community PCSOs; and specialist domestic abuse advisers in 999 control rooms at peak times" (manifesto page
        129); central figure only. No independent costing was found. The first-year Neighbourhood Policing Grant in
        2025-26 was £200m (Home Office police funding statistics).
        Low–high is an editorial ±10% because the source gives a central figure only.
      cost_sources:
        - title: "Labour Party: Change, 2024 manifesto (PDF), costings, page 129"
          url: https://labour.org.uk/wp-content/uploads/2024/06/Labour-Party-manifesto-2024.pdf#page=129
        - title: "Home Office: Police funding for England and Wales 2015 to 2027"
          url: https://www.gov.uk/government/statistics/police-funding-for-england-and-wales-2015-to-2027/police-funding-for-england-and-wales-2015-to-2027
      when: Not dated in the manifesto; the government's milestone is 13,000 over this Parliament (taken as by 1 July 2029)
      funded_by: >-
        "These new recruits will be paid for by tackling waste through a new Police Efficiency and Collaboration
        programme for England and Wales." (manifesto page 65)
