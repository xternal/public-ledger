versions:
  - version: 1
    text: >-
      That is why, as part of this strategy, we make a historic commitment to spend 5% of our GDP on national
      security by 2035.
    recorded_on: "2025-06-24"
    source_url: https://assets.publishing.service.gov.uk/media/685ab0da72588f418862075c/E03360428_National_Security_Strategy_Accessible.pdf
    quote_checked_on: "2026-10-06"
    parameters:
      who: UK defence and national security (3.5% of GDP core defence, 1.5% resilience and security)
      how_much_bn_per_year: [32.4, 36, 39.6]
      cost_note: >-
        Year shown: 2035, the target year, in today's terms; central figure only. The government gave no
        cost. The IFS estimates that raising core defence from 2.3% of GDP to 3.5% equals about £36bn a year
        in today's terms. There is no costing for the 1.5% on resilience and security, so the figure covers
        the core defence part only.
        Low–high is an editorial ±10% because the source gives a central figure only.
