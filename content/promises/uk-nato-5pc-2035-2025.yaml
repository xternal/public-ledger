id: uk-nato-5pc-2035-2025
headline: "5% of GDP on national security by 2035"
actor_id: keir-starmer
made_on: "2025-06-24"
venue_label: National Security Strategy 2025, PM's foreword, page 5
policy_area: defence
status: in_plan
status_note: >-
  The National Security Strategy commits to 5% of GDP on national security by 2035; No 10's 23 June 2025 press
  release gives a projected split of 3.5% core defence and 1.5% resilience and security; the June 2026 Defence
  Investment Plan restates the 3.5% for 2035, but money is set out only to 2029-30, at 2.7% of GDP. The deadline
  is taken as the end of 2035.
deadline: "2035-12-31"
lever_settings:
  defence_gdp: 3.5
preset_label: Core defence at 3.5% of GDP, the 2035 NATO pledge
origin: manual
