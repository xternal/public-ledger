versions:
  - version: 1
    text: >-
      That is why, as part of this strategy, we make a historic commitment to spend 5% of our GDP on national
      security by 2035.
    recorded_on: "2025-06-24"
    source_url: https://assets.publishing.service.gov.uk/media/685ab0da72588f418862075c/E03360428_National_Security_Strategy_Accessible.pdf
    quote_checked_on: "2026-10-06"
    parameters:
      who: UK defence and national security (3.5% of GDP core defence, 1.5% resilience and security)
      how_much_bn_per_year: [36, 40, 44]
      cost_note: >-
        Year shown: 2034-35, in 2025-26 terms. The government gave no cost. The OBR estimates that raising
        core defence spending from 2.4% of GDP in 2025-26 to 3.5% would cost around £40bn a year by 2034-35.
        The government says the further 1.5% of GDP for resilience and security is met within existing
        spending plans, as the OBR reports, so the figure covers core defence only. It overlaps with the rise
        on the separate 2027 defence card. Low–high is an editorial ±10% because the OBR gives a central
        figure only; the IFS puts the rise at about £36bn a year.
      cost_sources:
        - title: "OBR: Economic and fiscal outlook, March 2026, paragraph 4.15"
          url: https://assets.publishing.service.gov.uk/media/69a6d7b62e1f4fbda4252208/economic-and-fiscal-outlook-march-2026-web-accessible.pdf#page=70
        - title: "OBR: Fiscal risks and sustainability, July 2025, paragraph 5.18"
          url: https://obr.uk/docs/dlm_uploads/Fiscal-risks-and-sustainability-report-July-2025.pdf#page=137
        - title: "IFS Green Budget 2025: Honouring NATO defence spending commitment would reshape British state"
          url: https://ifs.org.uk/news/honouring-nato-defence-spending-commitment-would-reshape-british-state
      when: By 2035
      funded_by: null
