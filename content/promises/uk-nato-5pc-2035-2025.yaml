corrections:
  - date: "2026-10-06"
    path: versions[0].parameters.cost_note
    was: >-
      Year shown: 2035, the target year, in today's terms; central figure only. The government gave no
      cost. The IFS estimates that raising core defence from 2.3% of GDP to 3.5% equals about £36bn a year
      in today's terms. There is no costing for the 1.5% on resilience and security, so the figure covers
      the core defence part only.
      Low–high is an editorial ±10% because the source gives a central figure only.
    now: >-
      Year shown: 2035, the target year, in 2025 terms; central figure only. The government gave no
      cost. The IFS estimates that raising core defence from 2.3% of GDP to 3.5% equals about £36bn a year
      in 2025 terms. The IFS figure is measured from 2024 spending (2.3% of GDP), so it overlaps with the
      rise to 2.5% on the separate 2027 defence card. There is no costing for the 1.5% on resilience and
      security, so the figure covers the core defence part only.
      Low–high is an editorial ±10% because the source gives a central figure only.
    reason: >-
      "Today's terms" meant the IFS's 2025 terms, and the note did not say that the IFS figure starts from 2024
      spending. It therefore includes the rise to 2.5% already counted on the 2027 defence card.
    source_url: https://ifs.org.uk/news/honouring-nato-defence-spending-commitment-would-reshape-british-state
