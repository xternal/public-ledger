  - title: "No 10 press release, 23 Jun 2025: UK to deliver on 5% NATO pledge"
    url: https://www.gov.uk/government/news/uk-to-deliver-on-5-nato-pledge-as-government-drives-greater-security-for-working-people
  - title: "The Defence Investment Plan: funding explainer, 30 Jun 2026"
    url: https://www.gov.uk/government/publications/the-defence-investment-plan/the-defence-investment-plan-funding-explainer
