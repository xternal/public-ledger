policy_area: defence
status: in_plan
status_note: >-
  The National Security Strategy and the June 2026 Defence Investment Plan name the commitment (3.5% of GDP
  on core defence and 1.5% on resilience and security by 2035), but money is set out only to 2029-30, at
  2.7% of GDP on core defence. The deadline is taken as the end of 2035.
