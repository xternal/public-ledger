  - version: 1
    text: >-
      Elected Greens will push too for the reform Capital Gains Tax (CGT) by aligning the rates paid by taxpayers on
      income and taxable gains. This would affect less than 2% of all income-tax payers.
    recorded_on: "2024-06-12"
    source_url: https://greenparty.org.uk/app/uploads/2024/06/Green-Party-2024-General-Election-Manifesto-Long-version-with-cover.pdf#page=13
    quote_checked_on: "2026-10-09"
    parameters:
      who: People with taxable capital gains; the party says under 2% of income tax payers would be affected
      how_much_bn_per_year: [-20.9, -19.0, -17.1]
      cost_note: >-
        Negative because the pledge raises money. Year shown: the end of the Parliament, the year of the party's
        figure. Party figure: about £19bn a year by the end of the Parliament (budget background paper, page 3).
        Independent estimates depend on the design. The Office of Tax Simplification (2020) put a static figure for
        aligning the rates at about £14bn a year, and said "nothing like this amount would be raised in practice".
        CenTax (September 2026) estimates £19.7bn more in 2030, but only for a package that also adds an investment
        allowance, ends the tax-free uplift at death and taxes gains when people leave the UK. HMRC's official
        estimates stop at a 10-point rise, show that rise on the higher rate losing £3,565m in 2028-29, and cannot
        be scaled up. No official costing of full alignment exists. Low–high is an editorial ±10% because the party
        gives a central figure only.
      cost_sources:
