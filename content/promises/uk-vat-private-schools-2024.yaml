id: uk-vat-private-schools-2024
headline: "End private schools’ VAT exemption and rates relief"
actor_id: labour
made_on: "2024-06-13"
venue: manifesto
venue_label: 2024 manifesto, page 82
policy_area: taxes
status: delivered
status_note: >-
  VAT at 20% has applied to private school fees since 1 January 2025 (Finance Act 2025), and charitable business rates
  relief for private schools in England ended from the 2025-26 financial year (Non-Domestic Rating (Multipliers and
  Private Schools) Act 2025). Business rates are devolved outside England. The High Court dismissed a human rights
  challenge to the VAT change on 13 June 2025 and the Court of Appeal dismissed the appeals on 27 February 2026; the
  Supreme Court gave permission to appeal on 22 May 2026 and has listed a hearing for 1–2 December 2026. This card
  tracks the two tax changes, not how the money is spent.
