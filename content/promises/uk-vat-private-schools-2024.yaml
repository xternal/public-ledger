versions:
  - version: 1
    text: >-
      Labour will end the VAT exemption and business rates relief for private schools to invest in our state schools.
    recorded_on: "2024-06-13"
    source_url: https://labour.org.uk/wp-content/uploads/2024/06/Labour-Party-manifesto-2024.pdf#page=82
    quote_checked_on: "2026-10-06"
    parameters:
      who: Families paying private school fees and the schools (pay more); the stated aim is investment in state schools
      how_much_bn_per_year: [-1.75, -1.75, -1.51]
      costed_by:
        kind: official
        name: HM Treasury
      cost_note: >-
        Negative because the pledge raises money. Year used: 2028-29, the year Labour's costings use. Central is the
        official figure from Autumn Budget 2024, certified by the OBR: £1,665m from VAT plus £85m from business rates
        (£1.75bn). The other end of the range is Labour's own figure for the same year, £1,510m (manifesto page 127).
        Official figures for other years: £460m VAT in 2024-25 (part year); £1,505m VAT and £70m rates in 2025-26;
        £1,560m and £85m in 2026-27; £1,725m and £90m in 2029-30.
      cost_sources:
        - title: "Labour Party: Change, 2024 manifesto (PDF), costings, page 127"
          url: https://labour.org.uk/wp-content/uploads/2024/06/Labour-Party-manifesto-2024.pdf#page=127
        - title: "HMRC: Private school fees, VAT measure (Exchequer impact)"
          url: https://www.gov.uk/government/publications/vat-on-private-school-fees/applying-vat-to-private-school-fees
        - title: "HM Treasury: Autumn Budget 2024, Table 5.1, lines 22-23"
          url: https://assets.publishing.service.gov.uk/media/672b9695fbd69e1861921c63/Autumn_Budget_2024_Accessible.pdf
      when: VAT from 1 January 2025; business rates relief removed from April 2025
      funded_by: >-
        Not a spending pledge; the manifesto says the change is "to invest in our state schools" (page 82), and its
        costings count the revenue towards public service pledges including 6,500 new expert teachers (page 127)
