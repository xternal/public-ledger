status_note: >-
  On 11 September 2026 DHSC published the initial Estates Safety Fund allocations for 2026-27 to 2029-30, listed
  by NHS trust with the number of schemes and sites (about £1.3bn for more than 950 schemes). DHSC says these
  schemes are approved to proceed to detailed design and that final cost and scope are subject to business case
  approvals. The list gives totals by trust, not by project, so the 10 major projects (over £200m) named in the
  9 September press release cannot be matched to it: Bristol Royal Infirmary (£41m), Royal Free Hospital, London
  (£32m), Stepping Hill Hospital, Stockport (£26m), Wycombe Hospital (£25m), St George’s Hospital, Stafford (£25m), John
  Howard Centre, London (£25m), Crystal Centre and Linden Centre, Essex (£15m), Queen Elizabeth Hospital, Gateshead
  (£12m), Lister Hospital, Hertfordshire (£11m) and Southend Hospital (£1m, to begin planning a replacement tower).
