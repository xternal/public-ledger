versions:
  - version: 1
    text: >-
      As a first step, in England we will deliver an extra two million NHS operations, scans, and appointments every
      year; that is 40,000 more appointments every week.
    recorded_on: "2024-06-13"
    source_url: https://labour.org.uk/wp-content/uploads/2024/06/Labour-Party-manifesto-2024.pdf#page=95
    quote_checked_on: "2026-10-06"
    parameters:
      who: NHS patients in England waiting for planned (elective) operations, scans and appointments
      how_much_bn_per_year: [0.909, 1.01, 1.111]
      cost_note: >-
        Year used: 2028-29, the year Labour's costings use. Labour's own figure is £1,010m (manifesto page 127);
        central figure only. No independent costing of the pledge itself was found. For comparison, Autumn Budget 2024
        included an additional £1.8bn to support elective activity since July 2024, and a £22.6bn rise in the health
        department's day-to-day budget in 2025-26 compared with 2023-24.
        Low–high is an editorial ±10% because the source gives a central figure only.
      cost_sources:
        - title: "Labour Party: Change, 2024 manifesto (PDF), costings, page 127"
          url: https://labour.org.uk/wp-content/uploads/2024/06/Labour-Party-manifesto-2024.pdf#page=127
