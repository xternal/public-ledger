id: uk-nhs-40000-appointments-2024
headline: "40,000 more NHS appointments every week"
actor_id: labour
made_on: "2024-06-13"
venue: manifesto
venue_label: 2024 manifesto, page 95
policy_area: health
status: delivering
status_note: >-
  The government reported almost 2.2 million more elective appointments in England in July to November 2024 than a
  year earlier, and in July 2025 the UK Statistics Authority said its regulator had verified a figure of 3.6 million
  extra in the government's first eight months. The pledge is for every year, so the card sits at Delivering rather than Delivered. The manifesto sets no
  end date.
