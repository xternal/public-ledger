          url: https://assets.publishing.service.gov.uk/media/672b9695fbd69e1861921c63/Autumn_Budget_2024_Accessible.pdf
      when: Every year from the start of the Parliament; no end date stated
      funded_by: Cracking down on tax avoidance and non-dom loopholes (manifesto page 10)
