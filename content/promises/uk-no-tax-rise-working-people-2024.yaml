id: uk-no-tax-rise-working-people-2024
headline: "No tax rises for working people"
actor_id: labour
made_on: "2024-06-13"
venue: manifesto
venue_label: 2024 manifesto, page 21
policy_area: taxes
status: in_plan
status_note: >-
  Autumn Budget 2024 restated the commitment (para 2.35), Budget 2025 said the headline rates were not increasing
  (para 2.27), and the main rates of income tax (20%, 40%, 45%), employee National Insurance and VAT have not risen
  since the election. Other changes affect the same taxes: employer National Insurance rose to 15% from April 2025,
  income tax and National Insurance thresholds stay frozen to April 2031, and the dividend ordinary and upper rates
  rise by 2 points from April 2026, and tax rates on savings and property income by 2 points from April 2027
  (Finance Act 2026 ss.4, 5 and 7). The card stays at In plan until the pledge can be judged as a whole at the end
  of the Parliament, taken as 1 July 2029.
deadline: "2029-07-01"
origin: manual
editor_check_required: true
sources:
