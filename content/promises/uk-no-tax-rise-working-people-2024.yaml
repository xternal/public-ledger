      April 2025
    evidence_url: https://assets.publishing.service.gov.uk/media/672b9695fbd69e1861921c63/Autumn_Budget_2024_Accessible.pdf
  - date: "2025-11-26"
    type: in_plan
    text: >-
      Budget 2025 says the government is not increasing the headline rates of income tax, National Insurance
      contributions or VAT; it extends the threshold freeze to April 2031 and raises tax rates on dividend, savings
      and property income
    evidence_url: https://assets.publishing.service.gov.uk/media/6929b353345e31ab14ecf735/E03444720_Budget_2025_Web_Accessible.pdf
