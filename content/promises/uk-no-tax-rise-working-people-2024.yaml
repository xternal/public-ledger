    url: https://assets.publishing.service.gov.uk/media/6929b353345e31ab14ecf735/E03444720_Budget_2025_Web_Accessible.pdf
  - title: National Insurance Contributions (Secondary Class 1 Contributions) Act 2025
    url: https://www.legislation.gov.uk/ukpga/2025/11
  - title: Finance Act 2026 (main, dividend, savings and property income rates)
    url: https://www.legislation.gov.uk/ukpga/2026/11/contents
versions:
  - version: 1
    text: >-
      Labour will not increase taxes on working people, which is why we will not increase National Insurance, the
      basic, higher, or additional rates of Income Tax, or VAT.
    recorded_on: "2024-06-13"
    source_url: https://labour.org.uk/wp-content/uploads/2024/06/Labour-Party-manifesto-2024.pdf#page=21
    quote_checked_on: "2026-10-06"
    parameters:
      who: People in work across the UK who pay income tax, National Insurance and VAT
      how_much_bn_per_year: null
      cost_note: >-
        Keeping this pledge costs nothing against current plans, because it only rules out rises; Labour's
        fiscal plan lists no cost for it. For scale, HMRC estimates that in 2027-28 1p on the basic rate of
        income tax would raise about £8.25bn, 1 percentage point on the main rate of employee National
        Insurance about £5.3bn, and 1 percentage point on the standard rate of VAT about £9.2bn. These are
        HMRC's June 2025 estimates, made before Budget 2025; HMRC has postponed its next update.
      cost_sources:
        - title: "Labour Party: Change, 2024 manifesto (PDF), fiscal plan, page 126"
          url: https://labour.org.uk/wp-content/uploads/2024/06/Labour-Party-manifesto-2024.pdf#page=126
        - title: "HMRC: Direct effects of illustrative tax changes, bulletin (June 2025)"
          url: https://www.gov.uk/government/statistics/direct-effects-of-illustrative-tax-changes/direct-effects-of-illustrative-tax-changes-bulletin-january-2025
        - title: "HMRC: Direct effects of illustrative tax changes, tables (June 2025, ODS)"
          url: https://assets.publishing.service.gov.uk/media/68552862b46781eacfd71d71/June_2025_TRR_ODS__1_.ods
        - title: "HMRC: 2026 statistics announcements (6 Jul 2026: next edition postponed)"
          url: https://www.gov.uk/government/statistics/schedule-of-updates-and-announcements-for-hmrcs-statistics/2026-hmrc-statistics-announcements
      when: For the Parliament (taken as to 1 July 2029)
      funded_by: null
