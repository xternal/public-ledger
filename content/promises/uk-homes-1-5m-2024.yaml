status_note: >-
  Homes are being built and the government publishes official estimates against the target. The latest, published on
  24 September 2026, puts net additional homes in England since 9 July 2024 at 437,900, about 29% of 1.5 million, so
  the card sits at Delivering. The manifesto says "over the next parliament", taken here as by 1 July 2029.
