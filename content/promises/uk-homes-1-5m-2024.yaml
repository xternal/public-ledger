versions:
  - version: 1
    text: >-
      Labour will get Britain building again, creating jobs across England, with 1.5 million new homes over the next
      parliament.
    recorded_on: "2024-06-13"
    source_url: https://labour.org.uk/wp-content/uploads/2024/06/Labour-Party-manifesto-2024.pdf#page=36
    quote_checked_on: "2026-10-06"
    parameters:
      who: People in England who need a home; housebuilders and local planning authorities build and approve them
      how_much_bn_per_year: null
      cost_note: >-
        No official costing of the target as a whole exists, and most of the homes are expected to be built privately.
        Labour's costings list £20m a year for 300 new planning officers (page 127) and say policies not listed are
        funded from existing budgets or have no cost (page 126). Spending Review 2025 later confirmed £39bn over ten
        years for a new Affordable Homes Programme, which counts towards the target.
      cost_sources:
