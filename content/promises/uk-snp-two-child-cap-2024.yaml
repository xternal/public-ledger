id: uk-snp-two-child-cap-2024
actor_id: snp
made_on: "2024-06-19"
venue: manifesto
venue_label: 2024 manifesto, page 5 (key pledges)
policy_area: social_protection
status: delivered
status_note: >-
  The SNP is not in government at Westminster. The UK Government adopted the policy: Budget 2025 funded it, the
  Universal Credit (Removal of Two Child Limit) Act 2026 became law on 18 March 2026, and the limit stopped
  applying from 6 April 2026. This card records that the change the SNP asked for happened, not who made it.
origin: manual
outcome_by:
  actor_id: hm-government
  note: The UK Government removed the limit; the SNP is not in government at Westminster.
editor_check_required: true
sources:
  - title: "SNP: A Future Made in Scotland, 2024 manifesto (PDF), page 5"
    url: https://s3-eu-west-2.amazonaws.com/www.snp.org/uploads/2024/06/2024-06-20b-SNP-General-Election-Manifesto-2024_interactive.pdf
  - title: "SNP: John Swinney's 2024 manifesto speech, 19 Jun 2024"
    url: https://www.snp.org/snp-leader-john-swinneys-2024-manifesto-speech/
  - title: "HM Treasury: Budget 2025, 26 Nov 2025"
    url: https://www.gov.uk/government/publications/budget-2025-document/budget-2025-html
  - title: "legislation.gov.uk: Universal Credit (Removal of Two Child Limit) Act 2026"
    url: https://www.legislation.gov.uk/ukpga/2026/13/enacted
  - title: "DWP: Two-child limit scrapped as historic Bill becomes law, 19 Mar 2026"
    url: https://www.gov.uk/government/news/two-child-limit-scrapped-as-historic-bill-to-lift-450000-children-out-of-poverty-becomes-law
  - title: "DWP: Plan to track progress on lifting 550,000 children out of poverty published, 9 Jul 2026"
    url: https://www.gov.uk/government/news/plan-to-track-progress-on-lifting-550000-children-out-of-poverty-published
