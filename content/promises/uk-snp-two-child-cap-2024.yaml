    url: https://www.gov.uk/government/statistics/universal-credit-claimants-statistics-on-the-two-child-limit-policy-april-2026/universal-credit-claimants-statistics-on-the-two-child-limit-policy-april-2026
versions:
  - version: 1
    text: >-
      Scrap the two child benefit cap, ending the unnecessary suffering caused by both the benefit cap on children
      and associated rape clause.
    recorded_on: "2024-06-19"
    source_url: https://s3-eu-west-2.amazonaws.com/www.snp.org/uploads/2024/06/2024-06-20b-SNP-General-Election-Manifesto-2024_interactive.pdf
    quote_checked_on: "2026-10-06"
    parameters:
      who: Families with three or more children claiming Universal Credit or Child Tax Credit
      how_much_bn_per_year: [2.53, 2.815, 3.1]
      cost_note: >-
        The SNP did not publish a cost. The UK Government's Budget 2025 scorecard puts removing the limit at
        £2.365bn in 2026-27, £2.815bn in 2028-29 and £3.235bn in 2030-31. The card uses 2028-29, once the change
        has bedded in; the low–high range is an editorial ±10% because the scorecard gives central figures only.
      cost_sources:
        - title: "HM Treasury: Budget 2025, Table 4.1, line 6"
          url: https://www.gov.uk/government/publications/budget-2025-document/budget-2025-html
      when: Not stated in the manifesto
      funded_by: null
events:
  - date: "2024-06-19"
    type: promised
    text: SNP manifesto lists scrapping the two-child benefit cap among its key pledges
  - date: "2025-11-26"
    type: funded
    text: >-
      UK Government's Budget 2025 sets aside £2.4bn in 2026-27, rising to £3.2bn in 2030-31, to remove the limit
      from April 2026
    evidence_url: https://www.gov.uk/government/publications/budget-2025-document/budget-2025-html
  - date: "2026-03-18"
    type: legislated
    text: Universal Credit (Removal of Two Child Limit) Act 2026 receives Royal Assent
    evidence_url: https://www.legislation.gov.uk/ukpga/2026/13/enacted
  - date: "2026-04-06"
    type: delivered
    text: >-
      The limit stops applying for Universal Credit assessment periods starting on or after 6 April 2026; DWP
      later reports the last statistics on families affected
    evidence_url: https://www.gov.uk/government/news/plan-to-track-progress-on-lifting-550000-children-out-of-poverty-published
replies: []
