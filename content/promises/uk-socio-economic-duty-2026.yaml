status_note: >-
  The duty is section 1 of the Equality Act 2010, in force in Scotland since 1 April 2018 and in Wales since 31 March
  2021 but never commenced in England; legislation.gov.uk lists no commencement for England, and no date had been
  announced by 7 October 2026. The same statement announced the closure of the Social Mobility Commission, to be
  achieved through primary legislation "when Parliamentary time and consideration allows".
