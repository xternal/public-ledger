versions:
  - version: 1
    text: >-
      Crucially, the unit will lead the enactment of the Socio-Economic Duty, a new power in the Equality Act that
      will legally require public bodies to consider how to improve the lives of lower-income families as part of
      decisions around issues like transport, services and budgets.
    recorded_on: "2026-09-09"
    source_url: https://questions-statements.parliament.uk/written-statements/detail/2026-09-09/HCWS322
    quote_checked_on: "2026-10-07"
    parameters:
      who: >-
        Public bodies in England covered by section 1 of the Equality Act 2010, which would have to consider
        reducing inequalities of outcome from socio-economic disadvantage in strategic decisions; lower-income
        families
      cost_note: >-
        Too small to show in billions. The only official costing is the 2009 Equality Bill impact assessment:
        about £187,000 a year across 695 public bodies in England and Wales, plus about £468,000 once, almost
        all staff time. It uses 2008 pay rates, and the government has published no new costing for bringing
        the duty into force in England.
      cost_sources:
        - title: "Government Equalities Office: Equality Bill impact assessment, version 3 (Nov 2009), Annex A"
          url: https://assets.publishing.service.gov.uk/media/5a7c7cf4ed915d6969f4538c/9780108508677.pdf
      when: >-
        Not stated. A government press release the same day calls it one of the new Class Unit's early priorities.
      funded_by: null
events:
