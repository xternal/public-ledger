status_note: >-
  The Conservatives are not in government, so the card stays at Promised; the party's policy pages say the next
  Conservative Government will completely abolish the Zero Emission Vehicle (ZEV) mandate. Filed under economic
  affairs, not housing and environment, because the mandate regulates car and van makers' sales (transport and
  manufacturing are economic affairs in the COFOG classification the ledger uses) and the pledge was made in a
  statement on car-industry job losses.
