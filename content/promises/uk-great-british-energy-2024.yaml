versions:
  - version: 1
    text: >-
      To drive forward investment in clean, home-grown energy production, Labour will create a new publicly-owned
      company, Great British Energy. It will be owned by the British people and deliver power back to the British
      people.
    recorded_on: "2024-06-13"
    source_url: https://labour.org.uk/wp-content/uploads/2024/06/Labour-Party-manifesto-2024.pdf#page=53
    quote_checked_on: "2026-10-06"
    parameters:
      who: Energy billpayers and communities across the UK; taxpayers provide the company's capital
      how_much_bn_per_year: [1.53, 1.7, 1.87]
      cost_note: >-
        Year used: an average year of the Parliament, as Labour's costings give an annual average (£1.7bn, manifesto
        page 128) of the £8.3bn capitalisation promised on page 53; central figure only. Later official figures:
        Spending Review 2025 says Great British Energy and Great British Energy–Nuclear together will invest more than
        £8.3bn over the Parliament, and the company's 2025-26 annual report says up to £5.3bn is expected to be made
        available to it from 2025/26 to 2029/30. Autumn Budget 2024 gave £125m for 2025-26.
        Low–high is an editorial ±10% because the source gives a central figure only.
      cost_sources:
        - title: "Labour Party: Change, 2024 manifesto (PDF), Green Prosperity Plan costings, page 128"
          url: https://labour.org.uk/wp-content/uploads/2024/06/Labour-Party-manifesto-2024.pdf#page=128
        - title: "HM Treasury: Spending Review 2025"
          url: https://assets.publishing.service.gov.uk/media/68627094354985706f111adc/E03349913_HMT_Spending_Review_June_2025_TEXT_CS_Accessible__002_.pdf
        - title: "Great British Energy: Annual report and accounts 2025 to 2026"
          url: https://www.gov.uk/government/publications/great-british-energy-annual-report-and-accounts-2025-to-2026/gbe-annual-report-and-accounts-2025-to-2026-html
      when: Company set up in this Parliament; £8.3bn capitalisation over the Parliament (taken as to 1 July 2029)
      funded_by: >-
        A windfall tax on oil and gas giants (manifesto page 10); the wider Green Prosperity Plan is funded in part by a
        time-limited windfall tax on oil and gas giants and the rest by borrowing to invest within the fiscal rules
        (page 128)
events:
  - date: "2024-06-13"
    type: promised
    text: Labour manifesto pledges a new publicly owned company, Great British Energy
  - date: "2024-10-30"
    type: funded
    text: Autumn Budget 2024 confirms £125m for Great British Energy in 2025-26, with its headquarters in Aberdeen
    evidence_url: https://assets.publishing.service.gov.uk/media/672b9695fbd69e1861921c63/Autumn_Budget_2024_Accessible.pdf
  - date: "2025-05-15"
    type: legislated
    text: Great British Energy Act 2025 receives Royal Assent
    evidence_url: https://www.legislation.gov.uk/ukpga/2025/16
  - date: "2025-05-21"
    type: delivering
    text: Great British Energy Group Limited is designated as Great British Energy under the Act, with effect from 21 May 2025
    evidence_url: https://assets.publishing.service.gov.uk/media/682b504a8999f671f3c2443a/GBE-designation-letter.pdf
  - date: "2025-06-11"
    type: funded
    text: >-
      Spending Review 2025 says Great British Energy and Great British Energy–Nuclear will together invest more than
      £8.3bn over the Parliament
    evidence_url: https://assets.publishing.service.gov.uk/media/68627094354985706f111adc/E03349913_HMT_Spending_Review_June_2025_TEXT_CS_Accessible__002_.pdf
  - date: "2026-09-14"
    type: delivering
    text: >-
      First annual report: £255m invested (via DESNZ) in solar for 250 schools, 260 NHS sites and military sites in the
      period to 31 March 2026
    evidence_url: https://www.gov.uk/government/publications/great-british-energy-annual-report-and-accounts-2025-to-2026/gbe-annual-report-and-accounts-2025-to-2026-html
  - date: "2029-07-01"
    type: deadline
    text: End of the Parliament, when the £8.3bn capitalisation period ends (editorial date)
