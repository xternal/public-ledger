id: uk-great-british-energy-2024
actor_id: labour
made_on: "2024-06-13"
venue: manifesto
venue_label: 2024 manifesto, page 53
policy_area: economic_affairs
status: delivering
status_note: >-
  Great British Energy exists in law (Great British Energy Act 2025), is wholly owned by the Secretary of State for
  Energy Security and Net Zero and has started investing, including £255m in solar for schools, NHS and military sites
  in its first period to 31 March 2026. The manifesto's £8.3bn runs over the Parliament, and the government now counts
  that sum across both Great British Energy and Great British Energy–Nuclear, so the card sits at Delivering.
deadline: "2029-07-01"
origin: manual
editor_check_required: true
sources:
  - title: "Labour Party: Change, 2024 manifesto (PDF), page 53"
    url: https://labour.org.uk/wp-content/uploads/2024/06/Labour-Party-manifesto-2024.pdf#page=53
  - title: Great British Energy Act 2025
    url: https://www.legislation.gov.uk/ukpga/2025/16
  - title: "DESNZ: Notice of designation of Great British Energy (19 May 2025)"
    url: https://assets.publishing.service.gov.uk/media/682b504a8999f671f3c2443a/GBE-designation-letter.pdf
  - title: "HM Treasury: Spending Review 2025 (11 Jun 2025)"
