name: Nightly data refresh

on:
  schedule:
    # 04:30 UTC every day (05:30 BST, 04:30 GMT in winter)
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: etl-nightly
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        if: runner.environment == 'github-hosted'
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: etl/requirements.txt
      # The Mac fallback runner (docs/OPERATIONS.md §12): GitHub's Python builds for macOS only install
      # under /Users/runner, so use the Mac's own Python 3.14 (Homebrew) in a fresh virtual environment.
      - if: runner.environment == 'self-hosted'
        run: |
          python3.14 -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - run: pip install -r etl/requirements.txt
      # Fetch every source, normalise, check. A balance, coverage or staleness error fails the run.
      - run: python -m etl.build --trigger nightly
      # Contracts linked to promises (M6b): a changed value or end date appends a snapshot.
      - run: python -m etl.contracts
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # Node 22's bundled Corepack cannot run pnpm 12; use the version that works locally.
      - run: npm install -g corepack@0.34.5 && corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      # Make silence visible: append deadline_missed events to overdue cards.
      - run: pnpm deadlines
      - run: pnpm test
      - run: pnpm validate -- --base origin/main
      - name: Open a pull request when the data changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The run log and manifest change every night; only a change in the data itself opens a PR.
          if [ -z "$(git status --porcelain -- data/build/observations data/build/statements data/build/app.json data/build/levers.json data/build/tax.json data/build/people.json data/build/contracts content/promises)" ]; then
            echo "No data changes."
            exit 0
          fi
          branch="data/refresh-$(date -u +%Y-%m-%d)"
          git config user.name "public-ledger-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add data/build content/promises
          git commit -m "Data refresh $(date -u +%Y-%m-%d)"
          git push --force-with-lease origin "$branch"
          summary=$(python -m etl.summary)
          gh pr create --base main --head "$branch" --title "Data refresh $(date -u +%Y-%m-%d)" --body "$summary" || gh pr edit "$branch" --body "$summary"
