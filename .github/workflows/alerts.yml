name: Alerts

# Follow alerts (PRD F7, docs/OPERATIONS.md §8):
# - every push to main that changes content/ → detect changes, send instant alerts,
#   queue weekly digests, tell submitters their submission is now a card;
# - the weekly digest and daily maintenance on a schedule.
# Without the DATABASE_URL secret the job prints "Alerts not configured: skipping" and succeeds.
#
# Secrets go only to the one step that runs `pnpm alerts`, never to checkout or
# `pnpm install`, so a dependency's install script cannot read the database
# password or the keys that unlock subscribers' addresses (DPIA risk R9, M9).

on:
  push:
    branches: [main]
    paths: ["content/**"]
  schedule:
    # Weekly digest: Mondays 07:00 UTC = 08:00 BST (07:00 GMT once the clocks go back on 2026-10-25).
    - cron: "0 7 * * 1"
    # Daily maintenance: 03:30 UTC = 04:30 BST (03:30 GMT after 2026-10-25).
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      task:
        description: What to run
        type: choice
        options: [diff, digest, maintain]
        default: diff
      before:
        description: "diff: the commit before the change (empty = the parent of 'after')"
        required: false
      after:
        description: "diff: the commit after the change (empty = the tip of main)"
        required: false
      dry_run:
        description: Print what would happen without sending anything
        type: boolean
        default: true

permissions:
  contents: read

# One alerts run at a time, never cancelled half-way, so two quick pushes cannot race.
concurrency:
  group: alerts
  cancel-in-progress: false

jobs:
  alerts:
    runs-on: ${{ vars.RUNS_ON || 'ubuntu-latest' }}
    timeout-minutes: 15
    env:
      LEDGER_ENV: production
      # resend, ses or off: a repository variable, set by scripts/github-secrets.sh from Vercel's setting.
      MAIL_PROVIDER: ${{ vars.MAIL_PROVIDER || 'off' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # Node 22's bundled Corepack cannot run pnpm 12; use the version that works locally.
      - run: npm install -g corepack@0.34.5 && corepack enable pnpm
      - run: pnpm install --frozen-lockfile

      # One step for every trigger, so the secrets are written down once and reach nothing else:
      # push → diff (instant alerts); Monday 07:00 UTC → digest; 03:30 UTC daily → maintain; manual → the chosen task.
      - name: Run alerts
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
          TASK: ${{ inputs.task }}
          BEFORE: ${{ inputs.before }}
          AFTER: ${{ inputs.after }}
          DRY_RUN: ${{ inputs.dry_run }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LEDGER_ENCRYPTION_KEY: ${{ secrets.LEDGER_ENCRYPTION_KEY }}
          LEDGER_LOOKUP_PEPPER: ${{ secrets.LEDGER_LOOKUP_PEPPER }}
          ALTCHA_HMAC_KEY: ${{ secrets.ALTCHA_HMAC_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_REPLY_TO: ${{ secrets.MAIL_REPLY_TO }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_USERNAME: ${{ secrets.TELEGRAM_BOT_USERNAME }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          case "$EVENT:$SCHEDULE" in
            push:*)
              set -- diff --before "$PUSH_BEFORE" --after "$PUSH_AFTER" ;;
            "schedule:0 7 * * 1")
              set -- digest ;;
            "schedule:30 3 * * *")
              set -- maintain ;;
            workflow_dispatch:*)
              set -- "$TASK"
              if [ "$TASK" = "diff" ]; then
                set -- "$@" --after "${AFTER:-HEAD}"
                if [ -n "$BEFORE" ]; then set -- "$@" --before "$BEFORE"; fi
              fi
              if [ "$DRY_RUN" = "true" ]; then set -- "$@" --dry-run; fi ;;
            *)
              echo "Nothing to run for $EVENT $SCHEDULE"
              exit 0 ;;
          esac
          pnpm alerts -- "$@"
